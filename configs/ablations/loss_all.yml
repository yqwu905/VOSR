_base_: base_vosr2.yml
# Loss ablation: Base + GT + LPIPS + KL-OCR, each at its single-loss weight.
# Same dense student as Base (DINO/CA kept, no routing or token merging).
# Weights: see "Loss ablation configs" in docs/ablation_training.md.
ocr:
  type: ppocr  # PP-OCRv5_server_rec, PyTorch port
  checkpoint: PaddlePaddle/PP-OCRv5_server_rec_safetensors  # HF repo id or local copy
  strip_height: 64
  strip_stride: 32
  temperature: 1.0
training:
  output_dir: exp_vosr/loss_all
  gt_weight: 1.0
  lpips_weight: 0.02
  lpips_net: vgg
  ocr_kl_weight: 0.0005
