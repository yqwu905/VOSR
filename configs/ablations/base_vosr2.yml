# One-step teacher-preserving SFT. This is NOT the original FM/RCGM trainer.
# Run from the repository root. Set checkpoint, VAE and TXT dataset paths first.
teacher_checkpoint: preset/ckpts/VOSR2
student_checkpoint: null  # null = initialize from the same VOSR2 teacher
vae_path: preset/ckpts/Qwen-Image-vae-2d
model:
  patch_size: 2
  in_channels: 32
  out_channels: 16
  hidden_size: 1536
  depth: 36
  num_heads: 24
  mlp_ratio: 4.0
  z_dims: 1024
  encdim_ratio: 3
  num_fused_layers: 1
  auxiliary_time_cond: auto  # infer r_embedder presence; do not invent missing weights
  use_qknorm: true
  use_swiglu: true
  use_rope: true
  use_rmsnorm: true
  wo_shift: false
dino:
  size: 448
  layer: 17
  local_repo: null  # optional offline facebookresearch/dinov2 checkout
  cache_dir: preset/ckpts/torch_cache
# ocr:  # recognizer for training.ocr_kl_weight
#   type: ppocr  # PP-OCRv5_server_rec, PyTorch port (the only type)
#   checkpoint: PaddlePaddle/PP-OCRv5_server_rec_safetensors  # HF repo id or local copy
#   strip_height: 64  # full-width strips cut from the crop, HQ pixels
#   strip_stride: 32
#   temperature: 1.0
data:
  train_dataset_config: configs/train_txt/train_dataset_txt.txt
  dataset_type: txt  # upstream HQ image lists with integer repeat counts
  resolution: 512  # SFT crop, NOT a claim about original VOSR2 training resolution
  # Online LQ degradation/scale comes from dataloaders/params_realsr.yml.
student:
  use_cross_attention: true
  router_config: null
  ca_fade_steps: 0
training:
  output_dir: exp_vosr/ablation_base
  seed: 42
  precision: bf16
  batch_size_per_gpu: 1
  gradient_accumulation_steps: 1
  num_workers: 4
  max_steps: 10000
  learning_rate: 5.0e-6
  lr_warmup_steps: 100
  weight_decay: 0.01
  max_grad_norm: 1.0
  gradient_checkpointing: true
  zero_optimizer: true  # shard Adam states across DDP ranks; no NPU claim
  save_every: 1000
  log_every: 10
  report_to: [tensorboard, wandb]  # use none to disable external trackers
  tracker_project_name: vosr-ablation
  run_name: null  # default: output directory name; each launch creates a new W&B run
  wandb_mode: online  # WANDB_MODE overrides this; use online after wandb login
  preview_every: 500  # also at step 1 and the final step; 0 disables previews
  preview_num_images: 2  # fixed first N training samples, evaluated one at a time
  preview_seed: 1234
  gt_weight: 0.0  # optional clean-latent supervision from the same HQ crop
  # Optional pixel losses on the VAE-decoded prediction vs the HQ crop, off unless > 0
  # (kept commented so running jobs still resume; see docs/ablation_training.md):
  # lpips_weight: 0.0
  # lpips_net: vgg  # pyiqa LPIPS v0.1 trunk: vgg | alex
  # lpips_model_path: null  # optional local LPIPS linear-layer weights
  # ocr_kl_weight: 0.0  # KL between OCR CTC distributions; recognizer in the top-level ocr block
  dense_warmup_steps: 500
  budget_warmup_steps: 4500
  target_keep_ratio: 0.75  # global MLP token budget, NOT the whole-model FLOP ratio
  budget_scope: global  # average layers and ranks BEFORE squaring, per micro-batch
  budget_weight: 0.1
  router_lr_multiplier: 10.0
  dense_distill_weight: 0.1  # optional dense sandwich pass for routed SFT
