_base_: res1024.yml
# Ablation: res1024 plus the LPIPS and KL-OCR losses of loss_all.yml (same weights), KD kept.
# Pixel losses decode one random 512 window of each crop, the whole crop at 512.
ocr:
  type: ppocr
  checkpoint: PaddlePaddle/PP-OCRv5_server_rec_safetensors
  strip_height: 64
  strip_stride: 32
  temperature: 1.0
training:
  output_dir: exp_vosr/res1024_loss_all
  lpips_weight: 0.02
  lpips_net: vgg
  ocr_kl_weight: 0.0005
  pixel_loss_window: 512
