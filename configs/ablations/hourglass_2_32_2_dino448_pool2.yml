_base_: hourglass_2_32_2.yml
# DINO input ablation at the same DiT cost (486.5 GMACs, 29.7%): the teacher's 448-pixel DINO averaged
# 2x2 inside the model (cond_pool 2, 256 tokens) instead of a 224-pixel input. DINOv2 itself costs
# 271.5 instead of 60.8 GMACs per 512^2 tile.
student:
  dino:
    size: 448
  token_compression:
    cond_pool: 2
training:
  output_dir: exp_vosr/hourglass_2_32_2_dino448_pool2
